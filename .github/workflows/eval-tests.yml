name: Evaluation regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        websockets: ['13.1', '15.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: python -m pip install pytest numpy==1.26.4 tqdm tyro==0.9.2 websockets==${{ matrix.websockets }} typing-extensions msgpack
      - name: Test evaluation orchestration and result handling without models or simulators
        env:
          PYTHONPATH: packages/openpi-client/src:.
        run: python -m pytest -q examples/libero_plus
